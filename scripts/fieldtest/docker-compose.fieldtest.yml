# Field-test compose stack — the field-test environment for agentdrill.
#
# agentdrill ships no long-running service of its own (it is a CLI/SDK), so this
# overlay *is* the whole stack: the agentdrill CLI/SDK image (the system under
# test). There is **no LLM container** — the LLM is the local **oMLX** server on
# the host (OpenAI-compatible), reached from the container via
# `host.docker.internal:8000/v1`.
#
#   docker compose -f scripts/fieldtest/docker-compose.fieldtest.yml up -d agentdrill
#
# The image is built from the repo root (scripts/fieldtest/agentdrill.Dockerfile).
# Results are written to field-test/<FT_VERSION>/results/<run-id>/ by the run
# scripts, never into a container volume.
#
# Services:
#   agentdrill  — agentdrill CLI + SDK, output dir at /data/agentdrill
#
# `scripts/fieldtest/` is bind-mounted at /ft/scripts and the fixtures at
# /ft/fixtures so cases can run helper scripts inside the container without
# rebuilding the image.

services:
  agentdrill:
    build:
      # Context is the repo root; --project-directory pins this (see lib.sh).
      context: .
      dockerfile: scripts/fieldtest/agentdrill.Dockerfile
    image: agentdrill-fieldtest:${FT_TAG:-local}
    environment:
      AGENTDRILL_OUTPUT_DIR: /data/agentdrill/.agentdrill
      AGENTDRILL_LOG_LEVEL: info
      AGENTDRILL_SANDBOX: ${FT_SANDBOX:-false}
      # The LLM is the host oMLX server (OpenAI-compatible), reached via
      # host.docker.internal. Used by the agent matrix (Track B) and the judge.
      AGENTDRILL_FIELD_ENDPOINT: ${FT_LLM_BASE_URL:-http://host.docker.internal:8000/v1}
      AGENTDRILL_FIELD_MODEL: ${FT_LLM_MODEL:-Qwen3.5-4B-4bit}
      AGENTDRILL_FIELD_JUDGE_MODEL: ${FT_JUDGE_MODEL:-Qwen3.5-9B-MLX-4bit}
      OPENAI_API_KEY: ${FT_LLM_API_KEY:-omlx-test}
      OPENAI_BASE_URL: ${FT_LLM_BASE_URL:-http://host.docker.internal:8000/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # The SUT is "online" only when the CLI answers.
      test: ["CMD", "agentdrill", "version"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s
    volumes:
      - ftdata:/data/agentdrill
      - ./scripts/fieldtest:/ft/scripts:ro
      - ./scripts/fieldtest/fixtures:/ft/fixtures:ro
      # The field-test scenario packs + the case matrix, so in-container runs use
      # the real definitions, never a copy.
      - ./packs:/ft/packs:ro
      - ./scenarios:/ft/scenarios:ro
    command: ["sleep", "infinity"]

volumes:
  ftdata:
