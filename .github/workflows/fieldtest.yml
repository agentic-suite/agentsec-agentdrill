name: Field tests (nightly)

on:
  schedule:
    - cron: "0 9 * * *" # 02:00 PDT nightly
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fieldtest:
    # Local-tier cases need the host oMLX server (Apple Silicon MLX), so this
    # job must run on a self-hosted macOS runner (plan §5.9 / PRD 41: hosted
    # ubuntu-latest has no MLX). LLM cases fail loudly when oMLX is unreachable.
    runs-on: [self-hosted, macOS, arm64]
    timeout-minutes: 120
    env:
      FT_VERSION: v0.1.0
      FT_STRICT_STEPS: "1"
      FT_STRICT_GROUNDING: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Preflight (fail loudly, never skip)
        run: |
          docker info
          curl -sf --max-time 5 http://127.0.0.1:8000/v1/models | grep -E 'Qwen3-4B-Instruct-2507-4bit|Qwen3.5-4B-4bit'
          python3 -m pip install --quiet -e '.[dev,judge]'

      - name: Harness regression tests (M31 defects I-1..I-11)
        run: python3 -m pytest tests/test_m31_fieldtest_harness.py

      - name: Regenerate + strict-gate the case steps
        run: python3 scripts/fieldtest/gen_cases.py

      - name: Run every field-test suite (results -> field-test/)
        run: bash scripts/fieldtest/run-ft-all.sh

      - name: Deep-verification gate (every PASS must be grounded)
        run: python3 scripts/fieldtest/check_grounding.py

      - name: Leak gate (no unmasked secrets in committed results)
        run: python3 scripts/fieldtest/scan_results.py

      - name: Upload results (evidence, incl. LLM request/response captures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fieldtest-${{ github.run_id }}
          path: field-test/