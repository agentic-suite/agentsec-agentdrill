[project]
name = "agentsec-agentdrill"
version = "0.1.0"
description = "Continuous adversarial-testing (proof) engine for AI-agent defenses — run curated attack packs against the deployed stack, verify enforcement with the kill-chain, and publish an honest, reproducible defense benchmark."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "deghosal-2026" }]
keywords = [
    "agent",
    "evaluation",
    "testing",
    "llm",
    "ai",
    "scoring",
    "ci",
    "benchmark",
    "harness",
    "scenarios",
    "quality-assurance",
    "framework-agnostic",
    "pytest",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
urls.Homepage = "https://github.com/agentic-suite/agentsec-agentdrill"
urls.Repository = "https://github.com/agentic-suite/agentsec-agentdrill"
urls.Issues = "https://github.com/agentic-suite/agentsec-agentdrill/issues"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "click>=8.1",
    "httpx>=0.27",
    "rich>=13.7",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
judge = [
    "openai>=1.30",
    "anthropic>=0.30",
]
langgraph = [
    "langgraph>=0.2",
    "langchain-openai>=0.1",
    "python-dotenv>=1.0",
]
pydanticai = [
    "pydantic-ai>=0.0.10",
]
crewai = [
    "crewai>=0.100",
]
openai-agents = [
    "openai-agents>=0.1",
]
smolagents = [
    "smolagents>=1.0",
    "litellm>=1.0",
    "mcp>=2.3",
]
autogen = [
    "autogen-agentchat>=0.4",
    "autogen-ext>=0.4",
]
llamaindex = [
    "llama-index>=0.11",
    "llama-index-llms-openai-like>=0.3",
]
claude = [
    "claude-agent-sdk>=0.1",
]
adk = [
    "google-adk>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0.12.20260724",
]

[project.scripts]
agentdrill = "agentdrill.cli:main"

[project.entry-points."agentdrill.scorers"]

[project.entry-points."agentdrill.adapters"]

[project.entry-points."agentdrill.judges"]

[project.entry-points."agentdrill.benchmarks"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentdrill"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"field/**" = ["E402", "S101", "S110", "S112", "E501", "I001", "B010", "S307", "B007", "RUF005", "S602", "B904", "E401", "F841"]
"scripts/**" = ["S101"]
# Field-test harness drivers: generated case tables (E501), deliberate host
# subprocess/CLI invocations (S603/S607) and the pinned dummy oMLX key (S105).
"scripts/fieldtest/**" = ["E501", "S603", "S607", "S105"]
# Pre-existing agentdrill WBS issue generator: a prose/URL-heavy data script
# (issue bodies + PRD links), not importable library code — long lines and
# embedded en/× dashes in its string data are intentional.
"scripts/wbs_issues.py" = ["E401", "E501", "E702", "F841", "I001", "RUF001", "RUF002", "RUF005", "RUF022", "RUF100", "S603"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "agentdrill(pack=None, agent=None): run test with AgentDrill scenarios",
    "agentdrill_tags(tag1, tag2, ...): filter scenarios by tags",
    "omlx: integration tests requiring a running omlx server",
    "docker: integration tests requiring a running Docker daemon",
    "slow: tests that may take longer to complete",
    "field: field tests against real agents from GitHub",
]
filterwarnings = [
    "ignore:Field name \"schema\" in \"Expected\" shadows an attribute in parent \"BaseModel\"",
]